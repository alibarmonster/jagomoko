# GENERATED by `bun run sync:deployment` from config.yaml, for Envio Cloud (no env vars on its free plan).
# Edit config.yaml instead, then sync again.
# yaml-language-server: $schema=./node_modules/envio/evm.schema.json
name: streamquest-indexer
description: StreamQuest — stream RPG economy on Monad
# Security: only the explicitly listed contract addresses below are indexed (no
# wildcard indexing), so look-alike events emitted by attacker contracts are
# ignored. Reorgs are rolled back automatically (rollback_on_reorg).
rollback_on_reorg: true
address_format: checksum
# Monad testnet. HyperSync (needs ENVIO_API_TOKEN; the free plan allows 15 requests a minute) is only
# used to catch up on history. The live chain is followed through a QuickNode RPC (ENVIO_QUICKNODE_HTTP_URL
# and ENVIO_QUICKNODE_WSS_URL), so new blocks show up within a second or two. The deployed addresses
# (contracts/deployments/10143.json) have no defaults on purpose, so a missing address fails loudly
# instead of silently indexing the wrong contract.
contracts:
  - name: CreatorRegistry
    events:
      - event: "CreatorRegistered(uint256 indexed creatorId, address indexed owner, string handle, uint16 creatorBps, uint16 treasuryBps, uint16 communityBps)"
      - event: "ModeratorSet(uint256 indexed creatorId, address indexed moderator, bool enabled)"
      - event: "SplitChangeQueued(uint256 indexed creatorId, uint16 creatorBps, uint16 treasuryBps, uint16 communityBps, uint64 effectiveAt)"
      - event: "SplitChanged(uint256 indexed creatorId, uint16 creatorBps, uint16 treasuryBps, uint16 communityBps)"
  - name: Character
    events:
      - event: "CharacterMinted(address indexed player, uint256 indexed tokenId, uint8 role, string name)"
      - event: "XPChanged(address indexed player, uint256 indexed tokenId, uint256 newXp, int256 delta, uint8 kind)"
  - name: SplitVault
    events:
      - event: "Deposited(uint256 indexed creatorId, address indexed from, uint256 amount, uint256 creatorCut, uint256 treasuryCut, uint256 communityCut, string memo)"
      - event: "TreasuryFunded(uint256 indexed creatorId, address indexed from, uint256 amount, string reason)"
      - event: "CreatorWithdrawn(uint256 indexed creatorId, address indexed to, uint256 amount)"
      - event: "TreasurySpent(uint256 indexed creatorId, address indexed to, uint256 amount)"
      - event: "CommunitySpent(uint256 indexed creatorId, address indexed to, uint256 amount)"
      - event: "TreasuryTargetSet(uint256 indexed creatorId, uint16 bps)"
      - event: "TreasuryInvested(uint256 indexed creatorId, uint256 assets, uint256 shares)"
      - event: "TreasuryDivested(uint256 indexed creatorId, uint256 assets, uint256 shares)"
  - name: Jury
    events:
      - event: "CaseOpened(uint256 indexed caseId, address indexed client, uint256 indexed marketId, uint256 creatorId, address[] jurors, uint64 deadline)"
      - event: "CaseResolved(uint256 indexed caseId, uint8 verdict, uint16 yesVotes, uint16 noVotes)"
      - event: "JurorEnlisted(address indexed juror)"
      - event: "JurorLeft(address indexed juror)"
      - event: "JurorRewarded(uint256 indexed caseId, address indexed juror, uint256 fee)"
      - event: "JuryVoted(uint256 indexed caseId, address indexed juror, uint8 verdict)"
      - event: "ParamsSet(uint256 minLevel, uint256 jurorsPerCase, uint64 voteWindow, uint256 jurorFee)"
  - name: QuestEscrow
    events:
      - event: "QuestCreated(uint256 indexed questId, uint256 indexed creatorId, string title, uint64 goalDeadline)"
      - event: "QuestBacked(uint256 indexed questId, address indexed backer, uint256 amount, uint256 newPool)"
      - event: "QuestSettled(uint256 indexed questId, uint8 verdict, uint256 toCreatorVault, uint256 toTreasury, uint256 refundable)"
      - event: "QuestClaimed(uint256 indexed questId, address indexed backer, uint256 refund)"
      - event: "OutcomeProposed(uint256 indexed marketId, uint8 verdict, address indexed proposer, string proofURI, uint64 challengeDeadline)"
      - event: "OutcomeDisputed(uint256 indexed marketId, address indexed disputer, uint256 caseId)"
      - event: "MarketResolved(uint256 indexed marketId, uint8 verdict)"
  - name: PredictionBattle
    events:
      - event: "BattleCreated(uint256 indexed battleId, uint256 indexed creatorId, string question, string sideA, string sideB, uint64 closeTime, bool pointsMode)"
      - event: "BattleJoined(uint256 indexed battleId, address indexed player, uint8 side, uint256 amount, uint256 poolA, uint256 poolB)"
      - event: "BattleSettled(uint256 indexed battleId, uint8 verdict, bool refundAll, uint256 toTreasury, uint256 winnings)"
      - event: "BattleClaimed(uint256 indexed battleId, address indexed player, uint256 payout, uint256 xp)"
      - event: "OutcomeProposed(uint256 indexed marketId, uint8 verdict, address indexed proposer, string proofURI, uint64 challengeDeadline)"
      - event: "OutcomeDisputed(uint256 indexed marketId, address indexed disputer, uint256 caseId)"
      - event: "MarketResolved(uint256 indexed marketId, uint8 verdict)"
  - name: CommunityTreasury
    events:
      - event: "ProposalCreated(uint256 indexed proposalId, uint256 indexed creatorId, address indexed proposer, uint8 kind, address recipient, uint256 amount, string description, uint64 endsAt)"
      - event: "ProposalVoted(uint256 indexed proposalId, address indexed voter, bool support, uint256 weight)"
      - event: "ProposalFinalized(uint256 indexed proposalId, uint8 status)"
  - name: ClipBoard
    events:
      - event: "BountyCreated(uint256 indexed bountyId, uint256 indexed creatorId, address indexed by, string title, uint256 reward, uint64 submitEnd, uint64 voteEnd)"
      - event: "BountyFunded(uint256 indexed bountyId, uint256 indexed proposalId, uint256 amount)"
      - event: "ProposalFundsReturned(uint256 indexed proposalId, uint256 indexed creatorId, uint256 amount)"
      - event: "ClipSubmitted(uint256 indexed clipId, uint256 indexed bountyId, address indexed author, string url)"
      - event: "ClipVoted(uint256 indexed clipId, uint256 indexed bountyId, address indexed voter, uint256 weight)"
      - event: "ClipHidden(uint256 indexed clipId, uint256 indexed bountyId, bool hidden)"
      - event: "BountyWon(uint256 indexed bountyId, uint256 indexed clipId, address indexed author, uint256 amount)"
      - event: "BountyRefunded(uint256 indexed bountyId, uint256 toFunder, uint256 toTreasury)"
  - name: TipReceiver
    events:
      - event: "CrossChainTip(bytes32 indexed guid, uint32 indexed srcEid, address indexed donor, uint256 creatorId, uint256 amount)"
      - event: "TipBounced(bytes32 indexed guid, uint32 indexed srcEid, address indexed donor, uint256 creatorId, uint256 amount, uint8 reason)"
