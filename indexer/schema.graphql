# StreamQuest indexer schema.
#
# Security notes:
# - Every string that originates from users on-chain (handles, names, titles,
#   memos, questions, descriptions, proof links) is attacker-controlled. They
#   are sanitized in src/lib/sanitize.ts before being stored; `*Url` fields are
#   only ever set to a validated http(s) URL, never to the raw input.
# - Amounts are BigInt (token base units, 6 decimals) — never floats.
# - Balances/XP mirror authoritative on-chain values from events instead of
#   being re-derived, so the index cannot drift from the contracts.

enum Role {
  Knight
  Seer
  Judge
  Bard
}

enum XPKind {
  Back
  Predict
  Jury
  Clip
  Tip
  Governance
}

enum MarketStatus {
  Open
  Proposed
  Disputed
  Succeeded # quest: success / battle: side A won
  Failed # quest: failed / battle: side B won
  Invalid # jury tie / no jurors -> full refunds
}

enum MarketType {
  Quest
  Battle
}

enum Verdict {
  None
  Yes
  No
  Invalid
}

enum ProposalKind {
  Spend # pay `amount` to `recipient`
  Allocate # invest `amount` basis points of the treasury (0 = pull it all back)
}

enum ProposalStatus {
  Active
  Executed
  Defeated
  Vetoed
}

enum ActivityKind {
  CreatorJoined
  CharacterMinted
  Tip
  TipBounced # a cross-chain tip that could not be credited (refunded on Monad, or held back)
  QuestCreated
  QuestBacked
  QuestProposed
  QuestDisputed
  QuestResolved
  BattleCreated
  BattleJoined
  BattleProposed
  BattleDisputed
  BattleResolved
  JuryCaseOpened
  JuryCaseResolved
  ProposalCreated
  ProposalVoted
  ProposalFinalized
  TreasuryFunded
  TreasurySpent
  TreasuryInvested
  TreasuryDivested
  BountyCreated
  BountyFunded
  ClipSubmitted
  ClipVoted
  BountyWon
  BountyRefunded
}

enum BountyStatus {
  Open # taking clips, then votes (the screens tell the two apart by submitEnd)
  Won
  Refunded # nobody won: every part went back where it came from
}

enum FlowKind {
  CreatorWithdrawn
  TreasuryFunded
  TreasurySpent
  CommunitySpent
  TreasuryInvested
  TreasuryDivested
}

type Protocol {
  id: ID! # "global"
  creators: Int!
  players: Int!
  totalVolume: BigInt! # all tips + quest pools routed through the vault
  totalTreasury: BigInt! # all value that ever reached community treasuries
  quests: Int!
  battles: Int!
}

type Creator {
  id: ID! # on-chain creatorId
  owner: String! @index
  handle: String!
  handleKey: String! @index # lowercase, for case-insensitive lookups
  handleSanitized: Boolean! # true if the raw handle contained stripped characters
  creatorBps: Int!
  treasuryBps: Int!
  communityBps: Int!
  pendingCreatorBps: Int
  pendingTreasuryBps: Int
  pendingCommunityBps: Int
  pendingEffectiveAt: BigInt
  creatorBalance: BigInt!
  treasuryBalance: BigInt! # the LIQUID part; add the invested part (live: SplitVault.investedValue) for the total
  treasuryShares: BigInt! # strategy shares held for the treasury
  treasuryInvestedCost: BigInt! # what those shares cost, net of what was redeemed
  treasuryYieldRealized: BigInt! # yield banked by pulling money back out (negative = a loss)
  treasuryTargetBps: Int! # the share of the treasury the community wants invested
  communityBalance: BigInt!
  totalReceived: BigInt!
  tipCount: Int!
  createdAt: BigInt!
  # the guild: viewers who supported this creator (see src/lib/guild.ts)
  memberCount: Int!
  jago: Member # the member with the most guild XP; on a tie the one who got there first keeps it
  jagoXp: BigInt!
  members: [Member!]! @derivedFrom(field: "creator")
  bounties: [Bounty!]! @derivedFrom(field: "creator")
  moderators: [Moderator!]! @derivedFrom(field: "creator")
  deposits: [Deposit!]! @derivedFrom(field: "creator")
  quests: [Quest!]! @derivedFrom(field: "creator")
  battles: [Battle!]! @derivedFrom(field: "creator")
  proposals: [Proposal!]! @derivedFrom(field: "creator")
  activities: [Activity!]! @derivedFrom(field: "creator")
}

type Moderator {
  id: ID! # creatorId-address
  creator: Creator!
  account: String! @index
  enabled: Boolean!
}

type Player {
  id: ID! # address (checksummed)
  tokenId: BigInt!
  role: Role!
  name: String!
  nameSanitized: Boolean!
  xp: BigInt! @index
  level: Int!
  totalTipped: BigInt!
  totalBacked: BigInt!
  totalWon: BigInt!
  battlesWon: Int!
  juryVotes: Int!
  enlisted: Boolean!
  createdAt: BigInt!
  xpEvents: [XPEvent!]! @derivedFrom(field: "player")
  backings: [Backing!]! @derivedFrom(field: "backer")
  positions: [Position!]! @derivedFrom(field: "player")
  memberships: [Member!]! @derivedFrom(field: "player")
}

# A viewer's standing in one guild. Supporting a creator (a named tip, backing a quest, picking a
# side, a treasury proposal or vote, a clip) makes a viewer a member; an anonymous tip never does,
# and the guild's own creator is never a member of it.
type Member @index(fields: ["creator", ["guildXp", "DESC"]]) {
  id: ID! # creatorId-player
  creator: Creator!
  player: Player!
  guildXp: BigInt! # XP earned through this guild's actions (jury XP stays global), so it never drops
  totalTipped: BigInt! # named tips only
  totalBacked: BigInt!
  totalPicked: BigInt! # stakes in prediction battles
  actions: Int!
  joinedAt: BigInt!
  lastActiveAt: BigInt!
}

# XP granted in a transaction, waiting for that transaction's action event to credit it to a guild.
# Every contract grants XP right before it emits its own event (contracts/test/EventOrder.t.sol).
type PendingXP {
  id: ID! # block-txHash-player
  amount: BigInt!
}

# A cross-chain tip announced by TipReceiver.CrossChainTip, waiting for the SplitVault Deposited
# event of the same transaction to pick it up (same pattern as PendingXP).
type PendingSource {
  id: ID! # block-txHash-donor
  srcEid: Int!
  guid: String!
}

type XPEvent {
  id: ID!
  player: Player!
  delta: BigInt!
  newXp: BigInt!
  kind: XPKind!
  timestamp: BigInt!
}

type Deposit {
  id: ID!
  creator: Creator!
  from: String! @index
  amount: BigInt!
  creatorCut: BigInt!
  treasuryCut: BigInt!
  communityCut: BigInt!
  memo: String!
  # the tipper chose to hide their name (the account is still public on chain)
  anonymous: Boolean!
  # paid on another chain and delivered by LayerZero: the source endpoint id (40161 = Sepolia)
  via: Int
  lzGuid: String @index
  timestamp: BigInt! @index
  txHash: String!
}

type VaultFlow {
  id: ID!
  creator: Creator!
  kind: FlowKind!
  account: String!
  amount: BigInt!
  reason: String!
  timestamp: BigInt!
  txHash: String!
}

type Quest {
  id: ID!
  creator: Creator!
  title: String!
  goalDeadline: BigInt!
  pool: BigInt!
  backers: Int!
  status: MarketStatus! @index
  proposedVerdict: Verdict!
  proposer: String
  proofUrl: String # validated http(s) URL or null
  challengeDeadline: BigInt
  disputer: String
  juryCase: JuryCase
  toCreatorVault: BigInt!
  toTreasury: BigInt!
  refundable: BigInt!
  createdAt: BigInt!
  resolvedAt: BigInt
  backings: [Backing!]! @derivedFrom(field: "quest")
}

type Backing {
  id: ID! # questId-backer
  quest: Quest!
  backer: Player # null if the backer never minted a character
  backerAddress: String! @index
  amount: BigInt!
  claimed: Boolean!
  refund: BigInt!
}

type Battle {
  id: ID!
  creator: Creator!
  question: String!
  sideA: String!
  sideB: String!
  closeTime: BigInt!
  pointsMode: Boolean!
  poolA: BigInt!
  poolB: BigInt!
  playersA: Int!
  playersB: Int!
  status: MarketStatus! @index
  proposedVerdict: Verdict!
  proposer: String
  proofUrl: String
  challengeDeadline: BigInt
  disputer: String
  juryCase: JuryCase
  refundAll: Boolean!
  toTreasury: BigInt!
  winnings: BigInt!
  createdAt: BigInt!
  resolvedAt: BigInt
  positions: [Position!]! @derivedFrom(field: "battle")
}

type Position {
  id: ID! # battleId-player
  battle: Battle!
  player: Player # null if the player never minted a character
  playerAddress: String! @index
  side: Int!
  stake: BigInt!
  claimed: Boolean!
  payout: BigInt!
  xpEarned: BigInt!
}

type JuryCase {
  id: ID!
  marketType: MarketType!
  marketId: String!
  creator: Creator!
  jurors: [String!]!
  deadline: BigInt!
  yesVotes: Int!
  noVotes: Int!
  resolved: Boolean! @index
  verdict: Verdict!
  openedAt: BigInt!
  votes: [JuryVote!]! @derivedFrom(field: "juryCase")
}

type JuryVote {
  id: ID! # caseId-juror
  juryCase: JuryCase!
  juror: String! @index
  verdict: Verdict!
  fee: BigInt!
  timestamp: BigInt!
}

type JuryParams {
  id: ID! # "current"
  minLevel: BigInt!
  jurorsPerCase: BigInt!
  voteWindow: BigInt!
  jurorFee: BigInt!
}

type Proposal {
  id: ID!
  creator: Creator!
  proposer: String! @index
  kind: ProposalKind! @index
  recipient: String! # zero address for an allocation
  amount: BigInt! # tokens for a spend, basis points for an allocation
  description: String!
  endsAt: BigInt!
  forWeight: BigInt!
  againstWeight: BigInt!
  voters: Int!
  status: ProposalStatus! @index
  createdAt: BigInt!
  # a payout to ClipBoard is used once: attached to a bounty, or sent back to the treasury
  attachedTo: Bounty
  returned: Boolean!
  votes: [ProposalVote!]! @derivedFrom(field: "proposal")
}

type ProposalVote {
  id: ID! # proposalId-voter
  proposal: Proposal!
  voter: String! @index
  support: Boolean!
  weight: BigInt!
  timestamp: BigInt!
}

# Clip bounties (ClipBoard): Bards submit links, the community votes, the top clip takes the reward.
type Bounty {
  id: ID!
  creator: Creator!
  by: String! # who posted it: the creator or a mod
  title: String! # sanitized
  escrow: BigInt! # the creator's part
  communityFunds: BigInt! # treasury payouts attached to it
  submitEnd: BigInt!
  voteEnd: BigInt!
  clipCount: Int!
  voteCount: Int!
  status: BountyStatus! @index
  winner: Clip
  paidOut: BigInt!
  createdAt: BigInt!
  clips: [Clip!]! @derivedFrom(field: "bounty")
  fundings: [BountyFunding!]! @derivedFrom(field: "bounty")
}

type BountyFunding {
  id: ID! # proposalId
  bounty: Bounty!
  proposal: Proposal!
  amount: BigInt!
  timestamp: BigInt!
}

type Clip {
  id: ID!
  bounty: Bounty!
  author: String! @index
  authorPlayer: Player
  # a link from an allowed platform (src/lib/sanitize.ts clipUrl), or null: the raw input is never kept
  url: String
  platform: String # tiktok | youtube | twitch | instagram | x
  weight: BigInt! # total sqrt(XP) of its voters
  votes: Int!
  hidden: Boolean!
  won: Boolean!
  createdAt: BigInt!
  clipVotes: [ClipVote!]! @derivedFrom(field: "clip")
}

type ClipVote {
  id: ID! # bountyId-voter (one vote per bounty)
  clip: Clip!
  bountyId: String! @index
  voter: String! @index
  weight: BigInt!
  timestamp: BigInt!
}

# Append-only feed powering the live overlay and activity tickers.
type Activity @index(fields: ["creator", ["timestamp", "DESC"]]) {
  id: ID! # block-logIndex
  creator: Creator
  actor: String!
  kind: ActivityKind!
  amount: BigInt!
  refId: String!
  text: String! # sanitized
  # an anonymous tip: `actor` is the zero address so no screen can show who it was
  anonymous: Boolean!
  # a tip paid on another chain: the LayerZero endpoint id it came from
  via: Int
  timestamp: BigInt! @index
  txHash: String!
}
